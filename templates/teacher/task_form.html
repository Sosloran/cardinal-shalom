{% extends "base.html" %}
{% block title %}Crear Tarea — Cardinal Shalom{% endblock %}

{% block body %}
<div class="min-h-screen relative overflow-hidden">
  <div class="fixed inset-0 bg-gradient-to-br from-[#080f1e] via-[#0d2847] to-[#1a4a8a]"></div>
  <div class="fixed inset-0 opacity-30 pointer-events-none">
    <div class="particle-field"></div>
  </div>

  <div class="relative z-10 max-w-3xl mx-auto px-6 py-8">

    <div class="flex items-center gap-3 mb-8">
      <div class="logo-svg-inline">
        <img src="/static/img/logo.svg" alt="Cardinal Shalom" width="40" height="40">
      </div>
      <div class="flex-1">
        <h1 class="text-2xl font-bold text-white flash-animation">Crear Tarea</h1>
        <p class="text-sm text-[#9bb0cc] mt-1">Asignar una tarea a un RA existente.</p>
      </div>
      <a href="{{ url_for('teacher_my_classes') }}" class="text-[#9bb0cc] hover:text-white text-sm transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Mis Clases
      </a>
    </div>

    <div class="card p-6">
      <form method="POST" class="space-y-5">
        <input type="hidden" id="formRaId" name="ra_id" value="{{ request.args.get('ra_id', '') }}">

        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Resultado de Aprendizaje (RA) *</label>
          <select id="raSelect" name="ra_id" required onchange="updateRaPreview(this.value)"
                  class="input">
            <option value="">— Selecciona el RA —</option>
            {% for ra in ras %}
              <option value="{{ ra.id }}" {% if ra.id == request.args.get('ra_id', '')|escape %}selected{% endif %}>
                {{ ra.title }} ({{ ra.subject.name }})
              </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Titulo de la tarea *</label>
          <input type="text" name="title" required class="input" placeholder="Calcula el ROI de la campana...">
        </div>

        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Descripcion *</label>
          <textarea name="description" id="description" required rows="8"
                    class="input" placeholder="Describe la tarea, los objetivos y las instrucciones..."></textarea>
        </div>

        <div class="grid-2">
          <div>
            <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Fecha Limite *</label>
            <input type="datetime-local" name="due_date" required class="input">
          </div>
          <div>
            <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Puntuacion Maxima</label>
            <input type="number" name="max_score" value="100" min="1" max="100" class="input w-24">
          </div>
        </div>

        <div class="flex gap-3">
          <button type="submit" class="btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Publicar Tarea
          </button>
          <a href="{{ url_for('teacher_my_classes') }}" class="btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
  function updateRaPreview(raId) {
    document.getElementById('formRaId').value = raId;
  }
</script>
{% endblock %}
