{% extends "base.html" %}
{% block title %}Nueva Actividad — Cardinal Shalom{% endblock %}

{% block body %}
<div class="min-h-screen relative overflow-hidden">
  <div class="fixed inset-0 bg-gradient-to-br from-[#080f1e] via-[#0d2847] to-[#1a4a8a]"></div>
  <div class="fixed inset-0 opacity-30 pointer-events-none">
    <div class="particle-field"></div>
  </div>

  <div class="relative z-10 max-w-3xl mx-auto px-6 py-8">

    <div class="flex items-center gap-3 mb-8">
      <div class="logo-svg-inline">
        <img src="/static/img/logo.svg" alt="Cardinal Shalom" width="40" height="40">
      </div>
      <div class="flex-1">
        <h1 class="text-2xl font-bold text-white flash-animation">Publicar Actividad</h1>
        <p class="text-sm text-[#9bb0cc] mt-1">Noticia, circular, evento o galería.</p>
      </div>
      <a href="{{ url_for('activity_admin') }}" class="text-[#9bb0cc] hover:text-white text-sm transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Actividades
      </a>
    </div>

    <div class="card p-6">
      <form method="POST" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Titulo *</label>
          <input type="text" name="title" required class="input" placeholder="Escribe el titulo de la actividad">
        </div>

        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Categoria *</label>
          <div class="flex gap-2 flex-wrap">
            <label class="flex items-center gap-2 px-4 py-2 border border-[#2d6da8]/40 rounded-lg cursor-pointer hover:bg-[#0d2847]/60 transition">
              <input type="radio" name="category" value="news" class="text-[#3394ff]">
              <span class="text-sm text-white">📰 Noticia</span>
            </label>
            <label class="flex items-center gap-2 px-4 py-2 border border-[#2d6da8]/40 rounded-lg cursor-pointer hover:bg-[#0d2847]/60 transition">
              <input type="radio" name="category" value="circular" class="text-[#3394ff]">
              <span class="text-sm text-white">📢 Circular</span>
            </label>
            <label class="flex items-center gap-2 px-4 py-2 border border-[#2d6da8]/40 rounded-lg cursor-pointer hover:bg-[#0d2847]/60 transition">
              <input type="radio" name="category" value="event" class="text-[#3394ff]">
              <span class="text-sm text-white">📅 Evento</span>
            </label>
            <label class="flex items-center gap-2 px-4 py-2 border border-[#2d6da8]/40 rounded-lg cursor-pointer hover:bg-[#0d2847]/60 transition">
              <input type="radio" name="category" value="gallery" class="text-[#3394ff]">
              <span class="text-sm text-white">📸 Galeria</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">Contenido *</label>
          <textarea name="body" required rows="8" class="input" placeholder="Escribe el contenido de la actividad, noticia o circular..."></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-[#9bb0cc] mb-1">URL de imagen (opcional)</label>
          <input type="url" name="image_url" class="input" placeholder="https://ejemplo.edu.do/foto-evento.jpg">
        </div>

        <div class="flex gap-3">
          <button type="submit" class="btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            Publicar
          </button>
          <a href="{{ url_for('activity_admin') }}" class="btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
