databases:
  - name: cardinal-shalom-db
    databaseName: cardinalshalom
    user: cardinalshalom

services:
  - type: web
    name: cardinal-salom-web
    env: python
    region: oregon
    plan: free
    buildCommand: ""
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT -w 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cardinal-shalom-db
          property: connectionString
      - key: FLASK_ENV
        value: production
