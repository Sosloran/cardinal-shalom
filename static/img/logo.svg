<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <defs>
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3394FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo transparente: solo figura -->

  <!-- Triángulo isoceles con gradiente azul brillante -->
  <polygon
    points="100,10 185,150 15,150"
    fill="url(#triangleGrad)"
    filter="url(#glow)"
  />

  <!-- Paloma blanca (silueta simplificada con curvas bezier) -->
  <g transform="translate(100,95) scale(0.85)" filter="url(#glow)">
    <!-- cuerpo -->
    <ellipse cx="0" cy="5" rx="10" ry="14" fill="#ffffff"/>
    <!-- cabeza -->
    <circle cx="0" cy="-12" r="7" fill="#ffffff"/>
    <!-- alas -->
    <path d="M-2,-2 C-25,-15 -35,10 -10,22 Z" fill="#ffffff"/>
    <path d="M2,-2 C25,-15 35,10 10,22 Z" fill="#ffffff"/>
    <!-- cola -->
    <path d="M-2,18 L-10,26 L0,20 L10,26 L2,18 Z" fill="#ffffff"/>
    <!-- ojo -->
    <circle cx="-2.5" cy="-13" r="1.2" fill="#1e3a5f"/>
    <circle cx="2.5" cy="-13" r="1.2" fill="#1e3a5f"/>
  </g>

  <!-- Rama de olivo sutil -->
  <path d="M15,150 Q50,140 100,145 Q150,150 185,150" stroke="#7cb342" stroke-width="1.5" fill="none" opacity="0.5"/>
  <circle cx="50" cy="143" r="3" fill="#7cb342" opacity="0.4"/>
  <circle cx="80" cy="142" r="2.5" fill="#7cb342" opacity="0.4"/>
  <circle cx="120" cy="144" r="2.5" fill="#7cb342" opacity="0.4"/>
  <circle cx="150" cy="146" r="3" fill="#7cb342" opacity="0.4"/>

  <!-- Texto "Shalom" con glow suave -->
  <text x="100" y="165" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="2" filter="url(#glow)">SHALOM</text>
</svg>
